<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rasenschach</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="board-panel" aria-label="Rasenschach Spielfeld">
        <header class="topbar">
          <div>
            <p class="eyebrow">Draftboard</p>
            <h1>Rasenschach</h1>
          </div>
          <div class="match-controls">
            <label>
              Weiß
              <input id="whiteName" value="Spieler A" />
            </label>
            <label>
              Schwarz
              <input id="blackName" value="Spieler B" />
            </label>
          </div>
        </header>

        <div class="game-layout">
          <section class="scoreboard" aria-label="Spielstand">
            <div class="score-card white">
              <span id="whiteLabel">Spieler A</span>
              <strong id="whiteTotal">0</strong>
            </div>
            <div class="score-card black">
              <span id="blackLabel">Spieler B</span>
              <strong id="blackTotal">0</strong>
            </div>
          </section>

          <section class="field-wrap">
            <div class="side-note top">Felder zum Spieler aufstellen</div>
            <div class="side-note middle">Felder zum Thesen einordnen</div>
            <div class="side-note bottom">Felder zum Spieler anfüllen</div>
            <div class="chess-grid" id="pieceGrid" aria-label="Figuren und Thesenfelder"></div>
          </section>

          <section class="thesis-panel" aria-label="Thesen einordnen">
            <div class="thesis-head">
              <div>
                <p class="eyebrow">Thesenraum</p>
                <h2>12 Platzhalter einordnen</h2>
              </div>
              <button id="resetButton" type="button">Zurücksetzen</button>
            </div>
            <div class="thesis-list" id="thesisList"></div>
          </section>
        </div>
      </section>

      <section class="comparison" aria-label="Punktevergleich">
        <div class="bar-row">
          <span id="whiteBarLabel">Spieler A</span>
          <div class="bar-track"><div class="bar white-bar" id="whiteBar"></div></div>
          <strong id="whiteBarValue">0</strong>
        </div>
        <div class="bar-row">
          <span id="blackBarLabel">Spieler B</span>
          <div class="bar-track"><div class="bar black-bar" id="blackBar"></div></div>
          <strong id="blackBarValue">0</strong>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
